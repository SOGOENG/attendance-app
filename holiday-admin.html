<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    休日設定｜綜合エンジニアリング㈱
  </title>

  <link
    rel="stylesheet"
    href="style.css?v=25"
  >
</head>


<body>

  <main class="admin-home-page">

    <!-- ==============================
         ヘッダー
    ============================== -->
    <header class="admin-home-header">

      <div class="admin-home-header-text">

        <h1>
          綜合エンジニアリング㈱

          <span class="admin-home-portal-title">
            Staff Portal
          </span>
        </h1>

        <p>
          休日設定
        </p>

      </div>

      <a
        href="settings-admin.html"
        class="admin-home-back-button"
      >
        設定へ戻る
      </a>

    </header>


    <!-- ==============================
         年度・月選択
    ============================== -->
    <section class="admin-section-card">

      <h2>
        休日カレンダー
      </h2>

      <label class="admin-form-label">

        年度

        <select
          id="fiscalYearSelect"
          class="admin-form-control"
        >
        </select>

      </label>

      <label class="admin-form-label">

        月

        <select
          id="monthSelect"
          class="admin-form-control"
        >

          <option value="4">4月</option>
          <option value="5">5月</option>
          <option value="6">6月</option>
          <option value="7">7月</option>
          <option value="8">8月</option>
          <option value="9">9月</option>
          <option value="10">10月</option>
          <option value="11">11月</option>
          <option value="12">12月</option>
          <option value="1">1月</option>
          <option value="2">2月</option>
          <option value="3">3月</option>

        </select>

      </label>

      <div class="admin-action-buttons">

        <button
          id="createDefaultCalendarButton"
          type="button"
          class="admin-secondary-button"
        >
          自動設定を作成
        </button>

        <button
          id="saveCalendarButton"
          type="button"
          class="admin-primary-button"
        >
          この月を保存
        </button>

      </div>

      <p class="schedule-empty-message">
        基本は土日休みです。<br>
        同じ週に祝日がある場合、その週の土曜日を出勤日にします。
      </p>

      <p
        id="holidayMessage"
        class="schedule-message"
      ></p>

    </section>


    <!-- ==============================
         区分説明
    ============================== -->
    <section class="admin-section-card">

      <h2>
        日付の区分
      </h2>

      <div class="holiday-status-guide">

        <span class="holiday-guide-item holiday-guide-normal">
          有給奨励日
        </span>

        <span class="holiday-guide-item holiday-guide-holiday">
          休日
        </span>

        <span class="holiday-guide-item holiday-guide-public">
          祝日
        </span>

        <span class="holiday-guide-item holiday-guide-work">
          出勤
        </span>

      </div>

      <p class="schedule-empty-message">
        日付を押すと、出勤 → 休日 → 祝日 → 有給奨励日の順で切り替わります。
      </p>

    </section>


    <!-- ==============================
         カレンダー
    ============================== -->
    <section class="admin-section-card">

      <div class="holiday-calendar-header">

        <button
          id="previousMonthButton"
          type="button"
          class="admin-secondary-button"
        >
          前の月
        </button>

        <h2 id="calendarTitle">
          カレンダー
        </h2>

        <button
          id="nextMonthButton"
          type="button"
          class="admin-secondary-button"
        >
          次の月
        </button>

      </div>

      <div
        id="holidayCalendar"
        class="holiday-calendar"
      >

        <p class="schedule-empty-message">
          カレンダーを読み込み中...
        </p>

      </div>

    </section>

  </main>


  <script src="portal-auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@holiday-jp/holiday_jp@2.0.0/release/holiday_jp.min.js"></script>
  <script src="holiday-admin.js?v=6"></script>

</body>

</html>

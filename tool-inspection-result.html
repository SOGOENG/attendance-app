<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    点検結果｜綜合エンジニアリング㈱
  </title>

  <link
    rel="stylesheet"
    href="style.css?v=25"
  >

  <link
    rel="stylesheet"
    href="side-menu.css?v=1"
  >
</head>


<body>

  <main class="admin-home-page">

    <header class="admin-home-header">

      <div class="admin-home-header-text">

        <h1>
          綜合エンジニアリング㈱

          <span class="admin-home-portal-title">
            Staff Portal
          </span>
        </h1>

        <p>
          点検結果
        </p>

      </div>

      <a
        id="inspectionResultBackLink"
        href="tool-inspection.html"
        class="admin-home-back-button"
      >
        点検一覧へ戻る
      </a>

    </header>


    <!-- 工具情報 -->

    <section class="admin-section-card">

      <h2 id="resultToolName">
        工具情報を読み込み中...
      </h2>

      <p>
        大分類：
        <strong id="resultToolGroup">
          -
        </strong>
      </p>

      <p>
        管理番号：
        <strong id="resultManagementCode">
          -
        </strong>
      </p>

      <p>
        規格：
        <strong id="resultSpecification">
          -
        </strong>
      </p>

      <p>
        メーカー：
        <strong id="resultManufacturer">
          -
        </strong>
      </p>

      <p>
        型式：
        <strong id="resultModelNumber">
          -
        </strong>
      </p>

      <p>
        製造番号：
        <strong id="resultSerialNumber">
          -
        </strong>
      </p>

      <p>
        点検区分：
        <strong id="resultInspectionCategory">
          -
        </strong>
      </p>

    </section>


    <!-- 点検結果 -->

    <section class="admin-section-card">

      <h2>
        点検結果
      </h2>

      <p>
        点検日：
        <strong id="resultInspectionDate">
          -
        </strong>
      </p>

      <p>
        点検者：
        <strong id="resultInspector">
          -
        </strong>
      </p>

      <p>
        シール番号：
        <strong id="resultStickerNumber">
          -
        </strong>
      </p>

      <p>
        判定：
        <strong id="resultJudgement">
          -
        </strong>
      </p>

      <p>
        点検済みシール：
        <strong id="resultStickerConfirmed">
          -
        </strong>
      </p>

    </section>


    <!-- 点検項目 -->

    <section class="admin-section-card">

      <h2>
        点検項目
      </h2>

      <div
        id="resultChecklist"
        class="inspection-checklist"
      >
        <p class="schedule-empty-message">
          点検項目を読み込み中...
        </p>
      </div>

    </section>


    <!-- 不良・処置 -->

    <section class="admin-section-card">

      <h2>
        不良・処置
      </h2>

      <p>
        <strong>不良内容：</strong>
      </p>

      <p id="resultDefectDetail">
        -
      </p>


      <p>
        <strong>処置：</strong>
      </p>

      <p id="resultCorrectiveAction">
        -
      </p>


      <p>
        <strong>備考：</strong>
      </p>

      <p id="resultNote">
        -
      </p>

    </section>


    <p
      id="inspectionResultMessage"
      class="schedule-message"
    ></p>

  </main>


  <script src="portal-auth.js"></script>
  <script src="side-menu.js?v=1"></script>
  <script src="./tool-inspection-result.js?v=2"></script>

</body>

</html>

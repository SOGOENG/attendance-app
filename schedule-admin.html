<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    予定管理｜綜合エンジニアリング㈱
  </title>

  <link
    rel="stylesheet"
    href="style.css?v=8"
  >
</head>


<body>

  <main class="admin-home-page">

    <!-- ==============================
         ヘッダー
    ============================== -->
    <header class="admin-home-header">

      <div class="admin-home-header-text">

        <h1>
          綜合エンジニアリング㈱

          <span class="admin-home-portal-title">
            Staff Portal
          </span>
        </h1>

        <p>
          予定管理
        </p>

      </div>

      <a
        href="admin.html"
        class="admin-home-back-button"
      >
        管理メニューへ戻る
      </a>

    </header>


    <!-- ==============================
         予定登録・編集
    ============================== -->
    <section class="admin-section-card">

      <h2 id="scheduleFormTitle">
        予定登録
      </h2>

      <input
        id="editingScheduleId"
        type="hidden"
        value=""
      >

      <label class="admin-form-label">

        日付

        <input
          id="scheduleDate"
          type="date"
          class="admin-form-control"
        >

      </label>

      <label class="admin-form-label">

        開始時刻

        <input
          id="scheduleStartTime"
          type="time"
          class="admin-form-control"
        >

      </label>

      <label class="admin-form-label">

        予定名

        <input
          id="scheduleTitle"
          type="text"
          class="admin-form-control"
          placeholder="例：安全会議"
        >

      </label>

      <label class="admin-form-label">

        詳細

        <input
          id="scheduleDetails"
          type="text"
          class="admin-form-control"
          placeholder="例：会議室で実施"
        >

      </label>

      <label class="admin-form-label">

        対象

        <select
          id="scheduleTargetScope"
          class="admin-form-control"
        >

          <option value="all">
            全員
          </option>

          <option value="工事部">
            工事部
          </option>

          <option value="技術部">
            技術部
          </option>

          <option value="営業">
            営業
          </option>

          <option value="総務">
            総務
          </option>

        </select>

      </label>

      <div class="admin-action-buttons">

        <button
          id="addSchedule"
          type="button"
          class="admin-primary-button"
        >
          予定を登録
        </button>

        <button
          id="cancelScheduleEdit"
          type="button"
          class="admin-secondary-button"
          hidden
        >
          編集をやめる
        </button>

      </div>

      <p
        id="scheduleMessage"
        class="schedule-message"
      ></p>

    </section>


    <!-- ==============================
         登録済み予定
    ============================== -->
    <section class="admin-section-card">

      <h2>
        登録済み予定
      </h2>

      <div id="adminScheduleList">

        <p class="schedule-empty-message">
          予定を読み込み中...
        </p>

      </div>

    </section>

  </main>


  <script src="portal-auth.js"></script>
  <script src="schedule-admin.js?v=1"></script>

</body>

</html>

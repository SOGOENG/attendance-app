<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    工具管理｜綜合エンジニアリング㈱
  </title>

  <link
    rel="stylesheet"
    href="style.css?v=18"
  >
</head>


<body>

  <main class="admin-home-page">

    <!-- ==============================
         ヘッダー
    ============================== -->
    <header class="admin-home-header">

      <div class="admin-home-header-text">

        <h1>
          綜合エンジニアリング㈱

          <span class="admin-home-portal-title">
            Staff Portal
          </span>
        </h1>

        <p>
          工具管理
        </p>

      </div>

      <a
        href="home.html"
        class="admin-home-back-button"
      >
        ホームへ戻る
      </a>

    </header>


    <!-- ==============================
         工具管理メニュー
    ============================== -->
    <section class="admin-menu-section">

      <h2>
        工具管理メニュー
      </h2>

      <div class="admin-menu-list">


        <!-- 共有工具 -->
        <a
          href="shared-tools.html"
          class="admin-menu-card"
        >

          <div class="admin-menu-card-text">

            <h3>
              共有工具
            </h3>

            <p>
              現在地・持出・移動・返却
            </p>

          </div>

          <span class="admin-menu-card-arrow">
            〉
          </span>

        </a>


        <!-- 個人管理工具 -->
        <a
          href="#"
          class="admin-menu-card"
        >

          <div class="admin-menu-card-text">

            <h3>
              個人管理工具
            </h3>

            <p>
              使用者・点検状況を確認
            </p>

          </div>

          <span class="admin-menu-card-arrow">
            〉
          </span>

        </a>


        <!-- 半年点検 -->
        <a
          href="#"
          class="admin-menu-card"
        >

          <div class="admin-menu-card-text">

            <h3>
              半年点検
            </h3>

            <p>
              点検・シール番号・履歴・提出
            </p>

          </div>

          <span class="admin-menu-card-arrow">
            〉
          </span>

        </a>


        <!-- 工具マスタ管理 -->
        <a
          href="tool-master.html"
          id="toolMasterMenu"
          class="admin-menu-card hidden"
        >

          <div class="admin-menu-card-text">

            <h3>
              工具マスタ管理
            </h3>

            <p>
              登録・編集・使用停止・廃棄
            </p>

          </div>

          <span class="admin-menu-card-arrow">
            〉
          </span>

        </a>


        <!-- QRコード -->
        <a
          href="#"
          id="toolQrMenu"
          class="admin-menu-card hidden"
        >

          <div class="admin-menu-card-text">

            <h3>
              QRコード
            </h3>

            <p>
              QR表示・一括印刷
            </p>

          </div>

          <span class="admin-menu-card-arrow">
            〉
          </span>

        </a>

      </div>

    </section>

  </main>


  <script src="portal-auth.js"></script>

  <script>
    const savedUser =
      localStorage.getItem(
        "portalLoginUser"
      );

    if (!savedUser) {
      window.location.href =
        "login.html";

    } else {
      try {
        const loginUser =
          JSON.parse(savedUser);

        const isToolAdmin =
          loginUser.adminScope === "tool_admin";

        const isAdmin =
          loginUser.adminScope &&
          loginUser.adminScope !== "none" &&
          loginUser.adminScope !== "tool_admin";

        if (
          isToolAdmin ||
          isAdmin
        ) {
          document
            .getElementById(
              "toolMasterMenu"
            )
            .classList.remove(
              "hidden"
            );

          document
            .getElementById(
              "toolQrMenu"
            )
            .classList.remove(
              "hidden"
            );
        }

      } catch (error) {
        console.error(error);

        window.location.href =
          "login.html";
      }
    }
  </script>

</body>

</html>

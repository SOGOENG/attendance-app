<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    工具マスタ管理｜綜合エンジニアリング㈱
  </title>

  <link
    rel="stylesheet"
    href="style.css?v=25"
  >

  <link
    rel="stylesheet"
    href="side-menu.css?v=1"
  >
</head>


<body>

  <main class="admin-home-page">

    <header class="admin-home-header">

      <div class="admin-home-header-text">

        <h1>
          綜合エンジニアリング㈱

          <span class="admin-home-portal-title">
            Staff Portal
          </span>
        </h1>

        <p>
          工具マスタ管理
        </p>

      </div>

      <a
        href="tool-management.html"
        class="admin-home-back-button"
      >
        工具管理へ戻る
      </a>

    </header>


    <!-- 新規工具登録ボタン -->
    <section class="admin-section-card">

      <button
        id="openNewToolButton"
        type="button"
        class="admin-primary-button"
      >
        ＋ 新規工具登録
      </button>

    </section>


    <!-- 工具登録・編集 -->
    <section
      id="toolFormSection"
      class="admin-section-card"
      hidden
    >

      <h2 id="toolFormTitle">
        工具登録
      </h2>

      <input
        id="editingToolId"
        type="hidden"
        value=""
      >


      <label class="admin-form-label">
        大分類

        <select
          id="toolGroup"
          class="admin-form-control"
        >
          <option value="">
            ---- 選択 ----
          </option>

          <option value="配管加工機">配管加工機</option>
          <option value="切断工具">切断工具</option>
          <option value="研磨・仕上げ工具">研磨・仕上げ工具</option>
          <option value="穴あけ・斫り工具">穴あけ・斫り工具</option>
          <option value="締付・圧着工具">締付・圧着工具</option>
          <option value="溶接機器">溶接機器</option>
          <option value="電源・配電機器">電源・配電機器</option>
          <option value="ポンプ・空圧機器">ポンプ・空圧機器</option>
          <option value="集塵・吸引">集塵・吸引</option>
          <option value="測定・探査">測定・探査</option>
          <option value="電動・汎用工具">電動・汎用工具</option>
          <option value="充電工具">充電工具</option>
          <option value="その他">その他</option>

        </select>
      </label>


      <label class="admin-form-label">
        工具名

        <select
          id="toolName"
          class="admin-form-control"
        >
          <option value="">
            ---- 先に大分類を選択 ----
          </option>
        </select>
      </label>


      <label class="admin-form-label">
        仕様

        <input
          id="toolSpecification"
          type="text"
          class="admin-form-control"
          placeholder="例：3インチ"
        >
      </label>


      <label class="admin-form-label">
        管理番号

        <input
          id="toolManagementCode"
          type="text"
          class="admin-form-control"
          placeholder="例：SB-3IN-001"
        >
      </label>


      <label class="admin-form-label">
        所有区分

        <select
          id="toolOwnershipType"
          class="admin-form-control"
        >
          <option value="shared">
            共有（会社）
          </option>

          <option value="personal">
            個人（会社社員）
          </option>

          <option value="contractor">
            協力業者
          </option>
        </select>
      </label>


      <label
        id="assignedEmployeeLabel"
        class="admin-form-label"
        hidden
      >
        社員名

        <select
          id="toolAssignedEmployee"
          class="admin-form-control"
        >
          <option value="">
            ---- 選択 ----
          </option>
        </select>
      </label>


      <label
        id="contractorOwnerLabel"
        class="admin-form-label"
        hidden
      >
        協力業者名

        <input
          id="toolOwnerCompanyName"
          type="text"
          class="admin-form-control"
          placeholder="例：岩田工業"
        >
      </label>


      <label class="admin-form-label">
        メーカー

        <input
          id="toolManufacturer"
          type="text"
          class="admin-form-control"
        >
      </label>


      <label class="admin-form-label">
        型式

        <input
          id="toolModelNumber"
          type="text"
          class="admin-form-control"
        >
      </label>


      <label class="admin-form-label">
        製造番号

        <input
          id="toolSerialNumber"
          type="text"
          class="admin-form-control"
        >
      </label>


      <label class="admin-form-label">
        性能

        <input
          id="toolPerformance"
          type="text"
          class="admin-form-control"
        >
      </label>


      <label class="admin-form-label">
        半年点検

        <select
          id="toolInspectionRequired"
          class="admin-form-control"
        >
          <option value="false">
            対象外
          </option>

          <option value="true">
            対象
          </option>
        </select>
      </label>


      <label
  id="toolInspectionCategoryLabel"
  class="admin-form-label"
>
  点検区分

        <select
          id="toolInspectionCategory"
          class="admin-form-control"
        >
          <option value="">
            ---- 選択 ----
          </option>

          <option value="3p">3P工具</option>
          <option value="double_insulated">二重絶縁工具</option>
          <option value="battery">充電式工具</option>
          <option value="cord_reel">コードリール</option>
          <option value="ac_welder">交流式溶接機</option>
          <option value="dc_welder">直流式溶接機</option>
        </select>
      </label>


      <label class="admin-form-label">
        備考

        <textarea
          id="toolNote"
          class="admin-form-control"
          rows="4"
        ></textarea>
      </label>


      <div class="admin-action-buttons">

        <button
          id="saveToolButton"
          type="button"
          class="admin-primary-button"
        >
          登録する
        </button>

        <button
          id="cancelToolEditButton"
          type="button"
          class="admin-secondary-button"
        >
          閉じる
        </button>

        <button
          id="stopToolButton"
          type="button"
          class="admin-secondary-button"
          hidden
        >
          使用停止
        </button>

        <button
          id="disposeToolButton"
          type="button"
          class="admin-secondary-button"
          hidden
        >
          廃棄
        </button>

      </div>

      <p
        id="toolMasterMessage"
        class="schedule-message"
      ></p>

    </section>


    <!-- 工具検索 -->
    <section class="admin-section-card">

      <h2>
        工具検索
      </h2>


      <label class="admin-form-label">
        大分類

        <select
          id="toolSearchGroup"
          class="admin-form-control"
        >
          <option value="">
            すべて
          </option>

          <option value="配管加工機">配管加工機</option>
          <option value="切断工具">切断工具</option>
          <option value="研磨・仕上げ工具">研磨・仕上げ工具</option>
          <option value="穴あけ・斫り工具">穴あけ・斫り工具</option>
          <option value="締付・圧着工具">締付・圧着工具</option>
          <option value="溶接機器">溶接機器</option>
          <option value="電源・配電機器">電源・配電機器</option>
          <option value="ポンプ・空圧機器">ポンプ・空圧機器</option>
          <option value="集塵・吸引">集塵・吸引</option>
          <option value="測定・探査">測定・探査</option>
          <option value="電動・汎用工具">電動・汎用工具</option>
          <option value="充電工具">充電工具</option>
          <option value="その他">その他</option>

        </select>
      </label>


      <!-- ★検索用工具名 -->
      <label class="admin-form-label">
        工具名

        <select
          id="toolSearchName"
          class="admin-form-control"
        >
          <option value="">
            すべて
          </option>
        </select>
      </label>


      <label class="admin-form-label">
        所有区分

        <select
          id="toolSearchOwnership"
          class="admin-form-control"
        >
          <option value="">
            すべて
          </option>

          <option value="shared">
            共有（会社）
          </option>

          <option value="personal">
            個人（会社社員）
          </option>

          <option value="contractor">
            協力業者
          </option>
        </select>
      </label>


      <label class="admin-form-label">
        フリーワード

        <input
          id="toolMasterSearch"
          type="search"
          class="admin-form-control"
          placeholder="管理番号・社員名・協力業者名・メーカーなど"
        >
      </label>

    </section>


    <!-- 検索結果 -->
    <section class="admin-section-card">

      <h2 id="toolSearchResultTitle">
        検索結果
      </h2>

      <div
        id="toolMasterList"
        class="tool-list"
      >
        <p class="schedule-empty-message">
          工具情報を読み込み中...
        </p>
      </div>

    </section>

  </main>


  <script src="portal-auth.js"></script>
  <script src="side-menu.js?v=1"></script>

  <script>
    const savedUser =
      localStorage.getItem(
        "portalLoginUser"
      );

    if (!savedUser) {

      window.location.href =
        "login.html";

    } else {

      try {

        const loginUser =
          JSON.parse(
            savedUser
          );

        const canManageTools =
          loginUser.adminScope ===
            "tool_admin" ||
          (
            loginUser.adminScope &&
            loginUser.adminScope !==
              "none"
          );

        if (!canManageTools) {

          alert(
            "工具マスタを開く権限がありません"
          );

          window.location.href =
            "tool-management.html";
        }

      } catch (error) {

        console.error(
          error
        );

        window.location.href =
          "login.html";
      }
    }
  </script>


  <script src="./tool-master.js?v=21"></script>

</body>

</html>

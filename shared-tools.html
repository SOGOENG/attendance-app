<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    共有工具｜綜合エンジニアリング㈱
  </title>

  <link
    rel="stylesheet"
    href="style.css?v=29"
  >

  <link
    rel="stylesheet"
    href="side-menu.css?v=1"
  >
</head>


<body>

  <main class="admin-home-page">

    <header class="admin-home-header">

      <div class="admin-home-header-text">

        <h1>
          綜合エンジニアリング㈱

          <span class="admin-home-portal-title">
            Staff Portal
          </span>
        </h1>

        <p>
          共有工具
        </p>

      </div>

      <a
        href="tool-management.html"
        class="admin-home-back-button"
      >
        工具管理へ戻る
      </a>

    </header>


    <!-- =====================================
         QRコード読取
    ====================================== -->

    <section class="admin-section-card">

      <h2>
        工具QRコード
      </h2>

      <p class="tool-search-guide">
        工具のQRコードを読み取り、詳細画面を開きます。
      </p>

      <button
        id="sharedToolQrStartButton"
        type="button"
        class="admin-primary-button"
      >
        QRコードを読み込む
      </button>

      <div
        id="sharedToolQrPanel"
        class="shared-tool-qr-panel hidden"
      >
        <div id="sharedToolQrReader"></div>

        <button
          id="sharedToolQrCancelButton"
          type="button"
          class="admin-secondary-button"
        >
          読み取りをキャンセル
        </button>
      </div>

      <p
        id="sharedToolQrMessage"
        class="schedule-message"
        aria-live="polite"
      ></p>

    </section>


    <!-- =====================================
         検索
    ====================================== -->

    <section class="admin-section-card">

      <h2>
        工具を検索
      </h2>

      <p class="tool-search-guide">
        工具名・規格・メーカー・管理番号などから検索できます
      </p>

      <input
        id="sharedToolSearch"
        type="search"
        class="admin-form-control"
        placeholder="例：旋盤、3インチ、100V、マキタ"
        autocomplete="off"
      >

      <button
        id="sharedToolSearchButton"
        type="button"
        class="admin-primary-button"
      >
        検索
      </button>

    </section>


    <!-- =====================================
         工具から探す
    ====================================== -->

    <section class="admin-section-card">

      <h2>
        工具から探す
      </h2>

      <label class="admin-form-label">
        大分類

        <select
          id="toolGroupSelect"
          class="admin-form-control"
        >
          <option value="">
            ---- 大分類を選択 ----
          </option>
        </select>
      </label>


      <label class="admin-form-label">
        工具名

        <select
          id="toolNameSelect"
          class="admin-form-control"
          disabled
        >
          <option value="">
            ---- 工具名を選択 ----
          </option>
        </select>
      </label>


      <button
        id="toolSearchByCategoryButton"
        type="button"
        class="admin-primary-button"
      >
        表示する
      </button>

    </section>


    <!-- =====================================
         現場から探す
    ====================================== -->

    <section class="admin-section-card">

      <h2>
        現場から探す
      </h2>

      <label class="admin-form-label">
        現場

        <select
          id="toolSiteSelect"
          class="admin-form-control"
        >
          <option value="">
            ---- 現場を選択 ----
          </option>
        </select>
      </label>


      <button
        id="toolSearchBySiteButton"
        type="button"
        class="admin-primary-button"
      >
        表示する
      </button>

    </section>


    <!-- =====================================
         在庫を見る
    ====================================== -->

    <section class="admin-section-card">

      <h2>
        在庫を見る
      </h2>

      <p class="tool-search-guide">
        倉庫にあり、現在貸出できる工具だけ表示します
      </p>

      <label class="admin-form-label">
        大分類

        <select
          id="stockGroupSelect"
          class="admin-form-control"
        >
          <option value="">
            ---- 大分類を選択 ----
          </option>
        </select>
      </label>


      <label class="admin-form-label">
        工具名

        <select
          id="stockToolNameSelect"
          class="admin-form-control"
          disabled
        >
          <option value="">
            ---- 工具名を選択 ----
          </option>
        </select>
      </label>


      <button
        id="toolSearchStockButton"
        type="button"
        class="admin-primary-button"
      >
        在庫を表示
      </button>

    </section>


    <!-- =====================================
         結果
    ====================================== -->

    <section
      id="sharedToolResultSection"
      class="admin-section-card hidden"
    >

      <div class="tool-result-header">

        <h2 id="sharedToolResultTitle">
          検索結果
        </h2>

        <button
          id="sharedToolResultClose"
          type="button"
          class="admin-secondary-button"
        >
          閉じる
        </button>

      </div>

      <div
        id="sharedToolSummary"
        class="shared-tool-result-summary"
        aria-live="polite"
      ></div>

      <p
        id="sharedToolMessage"
        class="schedule-message"
      ></p>

      <div
        id="sharedToolList"
        class="tool-list"
      ></div>

    </section>

  </main>


  <script src="portal-auth.js"></script>
  <script src="side-menu.js?v=1"></script>

  <script
    src="https://unpkg.com/html5-qrcode"
  ></script>

  <script src="./tool-groups.js?v=1"></script>
  <script src="./shared-tools.js?v=15"></script>

</body>

</html>

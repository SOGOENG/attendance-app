<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    共有工具｜綜合エンジニアリング㈱
  </title>

  <link
    rel="stylesheet"
    href="style.css?v=19"
  >
</head>


<body>

  <main class="admin-home-page">

    <!-- ==============================
         ヘッダー
    ============================== -->
    <header class="admin-home-header">

      <div class="admin-home-header-text">

        <h1>
          綜合エンジニアリング㈱

          <span class="admin-home-portal-title">
            Staff Portal
          </span>
        </h1>

        <p>
          共有工具
        </p>

      </div>

      <a
        href="tool-management.html"
        class="admin-home-back-button"
      >
        工具管理へ戻る
      </a>

    </header>


    <!-- ==============================
         集計
    ============================== -->
    <section class="admin-section-card">

      <h2>
        共有工具状況
      </h2>

      <div class="tool-summary-grid">

        <div class="tool-summary-card">

          <strong>
            貸出可
          </strong>

          <span>
            0
          </span>

        </div>

        <div class="tool-summary-card">

          <strong>
            使用中
          </strong>

          <span>
            0
          </span>

        </div>

        <div class="tool-summary-card">

          <strong>
            修理中
          </strong>

          <span>
            0
          </span>

        </div>

      </div>

    </section>


    <!-- ==============================
         検索・絞り込み
    ============================== -->
    <section class="admin-section-card">

      <h2>
        工具検索
      </h2>

      <label class="admin-form-label">

        工具名・管理番号

        <input
          id="sharedToolSearch"
          type="search"
          class="admin-form-control"
          placeholder="例：旋盤、SB-3IN-001"
        >

      </label>

      <label class="admin-form-label">

        状態

        <select
          id="sharedToolStatusFilter"
          class="admin-form-control"
        >

          <option value="all">
            すべて
          </option>

          <option value="available">
            貸出可
          </option>

          <option value="in_use">
            使用中
          </option>

          <option value="repair">
            修理中
          </option>

          <option value="stopped">
            使用停止
          </option>

        </select>

      </label>

    </section>


    <!-- ==============================
         工具一覧
    ============================== -->
    <section class="admin-section-card">

      <h2>
        共有工具一覧
      </h2>

      <div
        id="sharedToolList"
        class="tool-list"
      >

        <!-- ==============================
             仮データ1
        ============================== -->
        <article class="tool-item-card">

          <div class="tool-item-main">

            <h3>
              旋盤 3インチ
            </h3>

            <p>
              管理番号：SB-3IN-001
            </p>

            <p>
              現在地：MTG
            </p>

            <p>
              担当者：二木
            </p>

            <p>
              状態：使用中
            </p>

          </div>

          <div class="tool-item-actions">

            <a
              href="tool-detail.html?id=1"
              class="admin-secondary-button"
            >
              詳細
            </a>

            <button
              type="button"
              class="admin-secondary-button"
            >
              移動
            </button>

            <button
              type="button"
              class="admin-primary-button"
            >
              返却
            </button>

          </div>

        </article>


        <!-- ==============================
             仮データ2
        ============================== -->
        <article class="tool-item-card">

          <div class="tool-item-main">

            <h3>
              バンドソー 175
            </h3>

            <p>
              管理番号：BS-175-001
            </p>

            <p>
              現在地：倉庫
            </p>

            <p>
              担当者：-
            </p>

            <p>
              状態：貸出可
            </p>

          </div>

          <div class="tool-item-actions">

            <a
              href="tool-detail.html?id=2"
              class="admin-secondary-button"
            >
              詳細
            </a>

            <button
              type="button"
              class="admin-primary-button"
            >
              持出
            </button>

          </div>

        </article>

      </div>

    </section>

  </main>


  <script src="portal-auth.js"></script>

</body>

</html>

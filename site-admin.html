<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>現場マスタ｜Staff Portal</title>
  <link rel="stylesheet" href="style.css?v=25"><link rel="stylesheet" href="master-admin.css?v=1">
</head>
<body><main class="admin-home-page">
  <header class="admin-home-header"><div class="admin-home-header-text"><h1>現場マスタ</h1></div>
    <a href="settings-admin.html" class="admin-home-back-button">設定へ戻る</a></header>
  <section class="admin-section-card">
    <h2>現場一覧</h2>
    <button id="newSiteButton" type="button" class="admin-primary-button" disabled>新規現場登録</button>
    <button id="reloadSites" type="button" class="admin-secondary-button">再読み込み</button>
    <a href="client-admin.html">元請マスタへ</a>
    <label class="admin-form-label">現場検索<input id="siteSearchInput" type="search" class="admin-form-control" placeholder="表示名・正式名称・工事番号・元請・入力コード"></label>
    <label class="admin-form-label">表示状態<select id="siteVisibleFilter" class="admin-form-control"><option value="all">すべて</option><option value="true">表示中</option><option value="false">非表示</option></select></label>
    <label class="admin-form-label">現場種別<select id="siteTypeFilter" class="admin-form-control"><option value="all">すべて</option><option value="一般">一般</option><option value="雑工事">雑工事</option></select></label>
    <p id="siteMessage" class="master-message" role="status" aria-live="polite"></p>
    <p id="siteOrderNote" class="master-note"></p>
    <div id="siteList"></div>
  </section>
  <section id="siteEditSection" class="admin-section-card" hidden>
    <h2 id="siteFormTitle">新規現場登録</h2>
    <form id="siteForm" novalidate>
      <input id="editingSiteId" type="hidden">
      <label class="admin-form-label">表示名（必須）<input id="siteDisplayName" class="admin-form-control" required></label>
      <label class="admin-form-label">元請（必須）<select id="siteClientId" class="admin-form-control" required></select></label>
      <p id="siteCodeNote" class="master-note"></p>
      <label class="admin-form-label">工事番号（必須）<input id="siteConstructionNo" class="admin-form-control" required></label>
      <label class="admin-form-label">正式名称（必須）<input id="siteOfficialName" class="admin-form-control" required></label>
      <label class="admin-form-label">表示状態<select id="siteVisible" class="admin-form-control"><option value="true">表示中</option><option value="false">非表示</option></select></label>
      <label class="admin-form-label">現場種別<select id="siteType" class="admin-form-control"><option value="一般">一般</option><option value="雑工事">雑工事</option></select></label>
      <p id="siteFormMessage" class="master-message" role="alert"></p>
      <button id="saveSiteButton" type="submit" class="admin-primary-button">保存する</button>
      <button id="cancelSiteEditButton" type="button" class="admin-secondary-button">閉じる</button>
    </form>
  </section>
</main><script src="portal-auth.js"></script><script src="master-admin-common.js?v=1"></script><script src="site-admin.js?v=2"></script></body>
</html>

<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    半年点検｜綜合エンジニアリング㈱
  </title>

  <link
    rel="stylesheet"
    href="style.css?v=25"
  >

  <link
    rel="stylesheet"
    href="side-menu.css?v=1"
  >
</head>


<body>

  <main class="admin-home-page">

    <header class="admin-home-header">

      <div class="admin-home-header-text">

        <h1>
          綜合エンジニアリング㈱

          <span class="admin-home-portal-title">
            Staff Portal
          </span>
        </h1>

        <p>
          半年点検
        </p>

      </div>

      <a
        href="tool-management.html"
        class="admin-home-back-button"
      >
        工具管理へ戻る
      </a>

    </header>


    <!-- =====================================
         新しい点検を開始
    ====================================== -->

    <details open class="admin-section-card">

      <summary>点検中</summary>

      <div
        id="inspectionCycleList"
        class="tool-list"
      >
        <p class="schedule-empty-message">
          点検情報を読み込み中...
        </p>
      </div>

    </details>
<details class="admin-section-card" id="inspectionHistorySection">
      <summary>履歴</summary>
      <label class="admin-form-label">年（暦年）<select id="inspectionHistoryYear" class="admin-form-control"></select></label>
      <div id="inspectionHistoryList" class="tool-list"></div>
    </details>
<details
      id="startInspectionSection"
      class="admin-section-card hidden"
    >

      <summary>新しい半年点検を開始</summary>

      <label class="admin-form-label">
        点検サイクル名

        <input
          id="inspectionCycleName"
          type="text"
          class="admin-form-control"
          placeholder="例：2026年12月点検"
        >
      </label>


      <label class="admin-form-label">
        開始シール番号

        <input
          id="inspectionStartStickerNumber"
          type="number"
          class="admin-form-control"
          min="1"
          placeholder="例：1001"
        >
      </label>


      <button
        id="startInspectionButton"
        type="button"
        class="admin-primary-button"
      >
        点検を開始
      </button>


      <p
        id="inspectionMessage"
        class="schedule-message"
      ></p>

    </details>

  </main>


  <script src="portal-auth.js"></script>
  <script src="side-menu.js?v=1"></script>
  <script src="./tool-registration.js?v=1"></script>
  <script src="./tool-inspection-workflow.js?v=1"></script>
  <script src="./tool-inspection.js?v=4"></script>

</body>

</html>

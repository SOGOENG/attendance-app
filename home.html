<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    綜合エンジニアリング㈱ Staff Portal
  </title>

  <link
    rel="stylesheet"
    href="style.css?v=17"
  >

  <link
    rel="manifest"
    href="manifest.json?v=2"
  >

  <link
    rel="apple-touch-icon"
    href="icons/se-apple-touch-icon.png"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <style>
    .home-primary-link {
      width: 100%;
      min-height: 84px;
      margin-top: 10px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-sizing: border-box;
      color: #2563eb;
      text-decoration: none;
      text-align: left;
      background: #ffffff;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
    }

    .home-primary-link:hover,
    .home-primary-link:active {
      background: #eff6ff;
    }

    .home-primary-link-text {
      flex: 1;
    }

    .home-primary-link-text h2 {
      margin: 0 0 4px;
      color: #2563eb;
      font-size: 18px;
    }

    .home-submission-warning {
      display: inline-flex;
      flex-direction: column;
      gap: 1px;
      margin: 0 0 6px;
      padding: 5px 8px;
      color: #b91c1c;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.35;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 7px;
    }

    .home-submission-warning.hidden {
      display: none;
    }

    .home-primary-link-text p {
      margin: 0;
      color: #64748b;
      font-size: 13px;
    }

    .home-primary-link-arrow {
      flex-shrink: 0;
      color: #2563eb;
      font-size: 24px;
      font-weight: 700;
    }
  </style>

</head>


<body>

  <main class="home-page">

    <!-- ==============================
         ヘッダー
    ============================== -->
    <header class="home-header">

      <div>

        <h1>
          綜合エンジニアリング㈱
          <br>

          <span class="portal-subtitle">
            Staff Portal
          </span>
        </h1>

        <p id="welcomeMessage">
          読み込み中...
        </p>

      </div>

      <button
        id="logoutButton"
        type="button"
        class="logout-button"
      >
        ログアウト
      </button>

    </header>


    <!-- ==============================
         ホームメニュー
    ============================== -->
    <section class="home-menu">

      <!-- ==============================
           今日・明日の予定
      ============================== -->
      <a
        href="schedule.html"
        class="schedule-card"
      >

        <div class="schedule-card-header">

          <div>

            <p class="schedule-card-label">
              TODAY & TOMORROW
            </p>

            <h2>
              今日・明日の予定
            </h2>

          </div>

          <div class="today-date-icon">

            <span id="todayDateMonth">
              --月
            </span>

            <strong id="todayDateDay">
              --
            </strong>

          </div>

        </div>

        <div id="todayScheduleList">

          <p class="schedule-empty-message">
            予定を読み込み中...
          </p>

        </div>

        <div class="schedule-card-footer">

          予定表を見る

          <span>
            〉
          </span>

        </div>

      </a>


      <!-- ==============================
           マイページ
      ============================== -->
      <a
        href="my-page.html"
        class="home-primary-link"
      >

        <div class="home-primary-link-text">

          <h2>
            マイページ
          </h2>

          <span
            id="homeSubmissionWarning"
            class="home-submission-warning hidden"
          >
            <span>
              未提出があります
            </span>

            <span>
              マイページを確認してください
            </span>
          </span>

          <p>
            出勤簿・提案・ヒヤリ・個人工具
          </p>

        </div>

        <span class="home-primary-link-arrow">
          〉
        </span>

      </a>


      <!-- ==============================
           現場搬入予定表
      ============================== -->
      <a
        href="#"
        id="deliveryCalendarLink"
        class="home-primary-link"
      >

        <div class="home-primary-link-text">

          <h2>
            現場搬入予定表
          </h2>

          <p>
            Googleカレンダー
          </p>

        </div>

        <span class="home-primary-link-arrow">
          〉
        </span>

      </a>


      <!-- ==============================
           設定
      ============================== -->
      <a
        href="settings.html"
        class="home-primary-link"
      >

        <div class="home-primary-link-text">

          <h2>
            設定
          </h2>

          <p>
            プロフィール・通知・表示設定
          </p>

        </div>

        <span class="home-primary-link-arrow">
          〉
        </span>

      </a>


      <!-- ==============================
           工具管理
      ============================== -->
      <a
        href="tool-management.html"
        id="toolManagementMenu"
        class="home-menu-card admin-menu-card hidden"
      >

        <div class="home-menu-icon">
          🧰
        </div>

        <div class="home-menu-text">

          <h2>
            工具管理
          </h2>

          <p>
            共有工具・個人工具・点検管理
          </p>

        </div>

        <span class="home-menu-arrow">
          〉
        </span>

      </a>


      <!-- ==============================
           通常管理者専用
      ============================== -->
      <a
        href="admin.html"
        id="adminMenu"
        class="home-menu-card admin-menu-card hidden"
      >

        <div class="home-menu-icon">
          ⚙️
        </div>

        <div class="home-menu-text">

          <h2>
            管理画面
          </h2>

          <p>
            管理者専用
          </p>

        </div>

        <span class="home-menu-arrow">
          〉
        </span>

      </a>

    </section>

  </main>


  <script src="portal-auth.js"></script>
  <script src="my-page.js?v=5"></script>
  <script src="home.js?v=6"></script>

</body>

</html>

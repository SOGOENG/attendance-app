<!doctype html>
<html lang="ja">

<head>

  <meta

        <h1>
          綜合エンジニアリング㈱

          <span class="admin-home-portal-title">
            Staff Portal
          </span>
        </h1>

        <p>
          設定

      </div>

      <a
        href="admin.html"
        class="admin-home-back-button"

        管理メニューへ戻る

    </header>


    <!-- ==============================
         設定メニュー

      </h2>

      <div class="admin-menu-list">


        <!-- 社員設定 -->
        <a

          <div class="admin-menu-card-icon">

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 9v-2a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v2H5Zm14-9v6m-3-3h6"
              />

          </div>

          <div class="admin-menu-card-text">

            <h3>
              社員設定
            </h3>

            <p>
              新規登録・情報修正・使用停止
            </p>

          </div>

          <span class="admin-menu-card-arrow">
            〉
          </span>

        </a>


        <!-- 現場設定 -->
        <a
          href="site-admin.html"
          class="admin-menu-card"
        >

          <div class="admin-menu-card-icon">

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M4 21V7l8-4 8 4v14H4Zm4-4h8m-8-4h8m-8-4h8"
              />
            </svg>

          </div>

          <div class="admin-menu-card-text">

            <h3>
              現場設定
            </h3>

            <p>
              現場の追加・修正・使用停止
            </p>

          </div>

          <span class="admin-menu-card-arrow">
            〉
          </span>

        </a>


        <!-- 休日設定 -->
        <a
          href="holiday-admin.html"
          class="admin-menu-card"
        >

          <div class="admin-menu-card-icon">

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M6 3v3m12-3v3M4 8h16v12H4V8Zm4 4h3m2 0h3m-8 4h3"
              />
            </svg>

          </div>

          <div class="admin-menu-card-text">

            <h3>
              休日設定
            </h3>

            <p>
              会社休日の登録・修正
            </p>

          </div>

          <span class="admin-menu-card-arrow">

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>各種申請 - Staff Portal</title><link rel="stylesheet" href="style.css?v=26"><link rel="stylesheet" href="side-menu.css?v=2"><link rel="stylesheet" href="applications.css?v=2"><link rel="stylesheet" href="applications-comp.css?v=1"></head><body>
<main class="applications-page"><header class="applications-header"><div><p class="applications-kicker">Staff Portal</p><h1>各種申請</h1></div><a class="applications-back" href="my-page.html">マイページへ</a></header>
<section class="applications-balance"><article class="balance-card"><span>有給残日数</span><strong id="paidBalance">--</strong><small id="paidBalanceYear">読込中</small></article><article class="balance-card"><span>代休残日数</span><strong id="compBalance">--</strong><small>未消化休日出勤</small></article></section>
<nav class="applications-tabs"><button class="is-active" data-panel="new">新規申請</button><button data-panel="history">自分の申請履歴</button></nav>
<section id="newPanel" class="applications-panel"><div id="typeList" class="type-list"></div>
<form id="paidForm" class="application-form" hidden><h2>有給休暇申請</h2><div id="paidEditNotice" class="edit-notice" hidden></div><div class="field"><label for="paidSite">現場名</label><select id="paidSite"><option value="">選択なし</option></select></div><div class="form-grid paid-date-grid"><div class="field"><label for="paidStart">開始日</label><input id="paidStart" type="date" required></div><div class="field"><label for="paidEnd">終了日</label><input id="paidEnd" type="date" required></div></div><div class="form-grid paid-option-grid"><div class="field"><label for="paidPart">取得区分</label><select id="paidPart"><option value="full">全日</option><option value="am">午前半休</option><option value="pm">午後半休</option></select></div><div class="field paid-days-field"><label for="paidDays">日数</label><input id="paidDays" type="number" min="0.5" step="0.5" inputmode="decimal" required></div></div><div class="field"><label for="paidReason">事由</label><textarea id="paidReason" rows="3"></textarea></div><p id="paidMessage" class="message"></p><button class="primary" type="submit">申請を提出する</button></form>
<form id="compForm" class="application-form" hidden><h2>代替休日申請</h2><div id="compEditNotice" class="edit-notice" hidden></div><div class="field"><label for="compNote">備考</label><textarea id="compNote" rows="2"></textarea></div><div class="subsection-head comp-date-heading"><h3>代替休日取得日</h3><button id="addCompDate" class="secondary" type="button">日付を追加</button></div><div id="compDates" class="comp-date-list"></div><div class="allocation-section"><h3>使用する休日出勤</h3><div id="workAllocations"></div></div><p id="compTotals" class="comp-totals"></p><p id="compMessage" class="message"></p><button class="primary" type="submit">申請を提出する</button></form></section>
<section id="historyPanel" class="applications-panel" hidden><p id="historyMessage" class="message" aria-live="polite"></p><div id="applicationHistory" class="application-list"><p class="empty">読み込み中...</p></div></section></main>
<script src="portal-auth.js"></script><script src="side-menu.js?v=2"></script><script src="applications.js?v=7"></script></body></html>

<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    個人管理工具｜綜合エンジニアリング㈱
  </title>

  <link
    rel="stylesheet"
    href="style.css?v=29"
  >

  <link
    rel="stylesheet"
    href="side-menu.css?v=1"
  >
</head>


<body>

  <main class="admin-home-page">

    <!-- ==============================
         ヘッダー
    ============================== -->
    <header class="admin-home-header">

      <div class="admin-home-header-text">

        <h1>
          綜合エンジニアリング㈱

          <span class="admin-home-portal-title">
            Staff Portal
          </span>
        </h1>

        <p>
          個人管理工具
        </p>

      </div>

      <div
        style="display: flex; flex-direction: column; gap: 10px;"
      >

        <a
          href="my-page.html"
          class="admin-home-back-button"
        >
          マイページへ戻る
        </a>

        <a
          href="tool-management.html"
          class="admin-home-back-button"
        >
          工具管理へ戻る
        </a>

      </div>

    </header>


    <!-- ==============================
         登録件数
    ============================== -->
    <section class="admin-section-card">

      <h2>
        個人工具
      </h2>

      <p>
        登録件数：
        <strong id="personalToolTotalCount">
          0
        </strong>
        件
      </p>

    </section>


    <!-- ==============================
         QRコード読取
    ============================== -->
    <section class="admin-section-card">

      <h2>
        工具QRコード
      </h2>

      <p class="tool-search-guide">
        工具のQRコードを読み取り、詳細画面を開きます。
      </p>

      <button
        id="personalToolQrStartButton"
        type="button"
        class="admin-primary-button"
      >
        QRコードを読み込む
      </button>

      <div
        id="personalToolQrPanel"
        class="personal-tool-qr-panel hidden"
      >
        <div id="personalToolQrReader"></div>

        <button
          id="personalToolQrCancelButton"
          type="button"
          class="admin-secondary-button"
        >
          読み取りをキャンセル
        </button>
      </div>

      <p
        id="personalToolQrMessage"
        class="schedule-message"
        aria-live="polite"
      ></p>

    </section>


    <!-- ==============================
         絞り込み
    ============================== -->
    <section class="admin-section-card">

      <h2>
        個人工具検索
      </h2>

      <label class="admin-form-label">
        社員名

        <select
          id="personalToolEmployee"
          class="admin-form-control"
        >
          <option value="">
            すべて
          </option>
        </select>
      </label>


      <label class="admin-form-label">
        フリーワード

        <input
          id="personalToolSearch"
          type="search"
          class="admin-form-control"
          placeholder="工具名・管理番号・メーカーなど"
        >
      </label>


      <button
        id="personalToolSearchButton"
        type="button"
        class="admin-primary-button"
        disabled
      >
        表示する
      </button>

    </section>


    <!-- ==============================
         一覧
    ============================== -->
    <section
      id="personalToolResultSection"
      class="admin-section-card hidden"
    >

      <div class="tool-result-header">

        <h2 id="personalToolResultTitle">
          検索結果
        </h2>

        <button
          id="personalToolResultClose"
          type="button"
          class="admin-secondary-button"
        >
          閉じる
        </button>

      </div>

      <div
        id="personalToolList"
        class="tool-list"
      ></div>

    </section>

  </main>


  <script src="portal-auth.js"></script>
  <script src="side-menu.js?v=1"></script>

  <script>
    const savedUser =
      localStorage.getItem(
        "portalLoginUser"
      );

    if (!savedUser) {

      window.location.href =
        "login.html";

    } else {

      try {

        JSON.parse(
          savedUser
        );

      } catch (error) {

        console.error(
          error
        );

        window.location.href =
          "login.html";
      }
    }
  </script>


  <script
    src="https://unpkg.com/html5-qrcode"
  ></script>

  <script src="./personal-tools.js?v=5"></script>

</body>

</html>

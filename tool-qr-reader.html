<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    QR読取｜綜合エンジニアリング㈱
  </title>

  <link
    rel="stylesheet"
    href="style.css?v=21"
  >

  <style>

    .qr-reader-card {
      max-width: 600px;
      margin: 0 auto;
    }

    .qr-reader-guide {
      margin-bottom: 18px;
      line-height: 1.6;
    }

    #qrReader {
      width: 100%;
      margin-top: 16px;
      overflow: hidden;
      border-radius: 12px;
      background: #f4f4f4;
    }

    .qr-reader-message {
      margin-top: 16px;
      font-weight: 700;
      text-align: center;
    }

  </style>

</head>


<body>

  <main class="admin-home-page">

    <header class="admin-home-header">

      <div class="admin-home-header-text">

        <h1>
          綜合エンジニアリング㈱

          <span class="admin-home-portal-title">
            Staff Portal
          </span>
        </h1>

        <p>
          工具QR読取
        </p>

      </div>

      <a
        href="tool-management.html"
        class="admin-home-back-button"
      >
        工具管理へ戻る
      </a>

    </header>


    <section class="admin-section-card qr-reader-card">

      <h2>
        QRコードを読み取る
      </h2>

      <p class="qr-reader-guide">
        カメラで工具のQRコードを読み取ると、
        その工具の詳細画面を開きます。
      </p>


      <button
        id="qrReaderStartButton"
        type="button"
        class="admin-primary-button"
      >
        カメラを起動
      </button>


      <div id="qrReader"></div>


      <p
        id="qrReaderMessage"
        class="qr-reader-message"
      ></p>

    </section>

  </main>


  <script src="portal-auth.js"></script>

  <script
    src="https://unpkg.com/html5-qrcode"
  ></script>

  <script src="./tool-qr-reader.js?v=2"></script>

</body>

</html>

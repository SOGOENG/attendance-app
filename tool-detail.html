<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    工具詳細｜綜合エンジニアリング㈱
  </title>

  <link
    rel="stylesheet"
    href="style.css?v=21"
  >
</head>


<body>

  <main class="admin-home-page">

    <!-- ==============================
         ヘッダー
    ============================== -->
    <header class="admin-home-header">

      <div class="admin-home-header-text">

        <h1>
          綜合エンジニアリング㈱

          <span class="admin-home-portal-title">
            Staff Portal
          </span>
        </h1>

        <p>
          工具詳細
        </p>

      </div>

      <a
        id="detailBackButton"
        href="shared-tools.html"
        class="admin-home-back-button"
      >
        工具一覧へ戻る
      </a>

    </header>


    <!-- ==============================
         基本情報
    ============================== -->
    <section class="admin-section-card">

      <h2 id="detailToolTitle">
        工具情報を読み込み中...
      </h2>

      <div class="tool-detail-info">

        <p>
          <strong>大分類：</strong>
          <span id="detailToolGroup">
            -
          </span>
        </p>

        <p>
          <strong>管理番号：</strong>
          <span id="detailManagementCode">
            -
          </span>
        </p>

        <p>
          <strong>仕様：</strong>
          <span id="detailSpecification">
            -
          </span>
        </p>

        <p>
          <strong>メーカー：</strong>
          <span id="detailManufacturer">
            -
          </span>
        </p>

        <p>
          <strong>型式：</strong>
          <span id="detailModelNumber">
            -
          </span>
        </p>

        <p>
          <strong>製造番号：</strong>
          <span id="detailSerialNumber">
            -
          </span>
        </p>

        <p>
          <strong>性能：</strong>
          <span id="detailPerformance">
            -
          </span>
        </p>


        <!-- 個人工具では非表示 -->
        <p id="detailCurrentSiteRow">

          <strong>現在地：</strong>

          <span id="detailCurrentSite">
            -
          </span>

        </p>


        <p>
          <strong>担当者：</strong>

          <span id="detailAssignedEmployee">
            -
          </span>
        </p>


        <!-- 個人工具では非表示 -->
        <p id="detailStatusRow">

          <strong>状態：</strong>

          <span id="detailStatus">
            -
          </span>

        </p>


        <p>
          <strong>備考：</strong>

          <span id="detailNote">
            -
          </span>
        </p>

      </div>

    </section>


    <!-- ==============================
         操作
         個人工具では非表示
    ============================== -->
    <section
      id="detailActionSection"
      class="admin-section-card"
    >

      <h2>
        操作
      </h2>

      <div
        id="detailActionButtons"
        class="tool-item-actions"
      ></div>

    </section>


    <!-- ==============================
         半年点検
    ============================== -->
    <section class="admin-section-card">

      <h2>
        半年点検
      </h2>

      <p>
        <strong>点検対象：</strong>

        <span id="detailInspectionRequired">
          -
        </span>
      </p>

      <p>
        <strong>点検区分：</strong>

        <span id="detailInspectionCategory">
          -
        </span>
      </p>

      <p>
        <strong>最終点検日：</strong>

        <span id="detailLastInspectionDate">
          未登録
        </span>
      </p>

      <p>
        <strong>点検シール番号：</strong>

        <span id="detailStickerNumber">
          未登録
        </span>
      </p>

    </section>


    <!-- ==============================
         バッテリー管理
         充電工具のみ表示
    ============================== -->
    <section
      id="batteryManagementSection"
      class="admin-section-card"
      style="display: none;"
    >

      <h2>
        バッテリー管理
      </h2>

      <p>
        <strong>最終交換日：</strong>

        <span id="detailLastBatteryReplacementDate">
          未登録
        </span>
      </p>


      <div class="tool-item-actions">

        <button
          id="openBatteryHistoryFormButton"
          type="button"
          class="admin-primary-button"
        >
          バッテリー交換を登録
        </button>

      </div>


      <!-- ==============================
           バッテリー交換登録フォーム
      ============================== -->
      <div
        id="batteryHistoryForm"
        style="display: none; margin-top: 20px;"
      >

        <h3>
          バッテリー交換登録
        </h3>


        <label class="admin-form-label">

          交換日

          <input
            id="batteryReplacementDate"
            type="date"
            class="admin-form-control"
          >

        </label>


        <label class="admin-form-label">

          バッテリー型式

          <input
            id="batteryModel"
            type="text"
            class="admin-form-control"
            placeholder="例：BL1860B"
          >

        </label>


        <label class="admin-form-label">

          交換理由

          <input
            id="batteryReplacementReason"
            type="text"
            class="admin-form-control"
            placeholder="例：容量低下"
          >

        </label>


        <label class="admin-form-label">

          備考

          <textarea
            id="batteryReplacementNote"
            class="admin-form-control"
            rows="3"
          ></textarea>

        </label>


        <div class="tool-item-actions">

          <button
            id="saveBatteryHistoryButton"
            type="button"
            class="admin-primary-button"
          >
            登録する
          </button>

          <button
            id="cancelBatteryHistoryButton"
            type="button"
            class="admin-secondary-button"
          >
            キャンセル
          </button>

        </div>


        <p
          id="batteryHistoryMessage"
          class="schedule-message"
        ></p>

      </div>


      <!-- ==============================
           バッテリー交換履歴
      ============================== -->
      <div style="margin-top: 24px;">

        <h3>
          交換履歴
        </h3>

        <div
          id="batteryHistoryList"
          class="tool-history-list"
        >

          <p class="schedule-empty-message">
            履歴を読み込み中...
          </p>

        </div>

      </div>

    </section>


    <!-- ==============================
         QRコード
    ============================== -->
    <section class="admin-section-card">

      <h2>
        QRコード
      </h2>

      <p>
        この工具専用のQRコードを表示します。
      </p>

      <div class="tool-item-actions">

        <button
          type="button"
          class="admin-secondary-button"
          disabled
        >
          QRコードを表示
        </button>

      </div>

    </section>


    <!-- ==============================
         履歴
    ============================== -->
    <section class="admin-section-card">

      <h2>
        履歴
      </h2>

      <div
        id="toolHistoryList"
        class="tool-history-list"
      >

        <p class="schedule-empty-message">
          履歴を読み込み中...
        </p>

      </div>

    </section>


    <p
      id="toolDetailMessage"
      class="schedule-message"
    ></p>

  </main>


  <script src="portal-auth.js"></script>

  <script src="./tool-detail.js?v=5"></script>

</body>

</html>

<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    工具詳細｜綜合エンジニアリング㈱
  </title>

  <link
    rel="stylesheet"
    href="style.css?v=19"
  >
</head>


<body>

  <main class="admin-home-page">

    <!-- ==============================
         ヘッダー
    ============================== -->
    <header class="admin-home-header">

      <div class="admin-home-header-text">

        <h1>
          綜合エンジニアリング㈱

          <span class="admin-home-portal-title">
            Staff Portal
          </span>
        </h1>

        <p>
          工具詳細
        </p>

      </div>

      <a
        href="shared-tools.html"
        class="admin-home-back-button"
      >
        共有工具へ戻る
      </a>

    </header>


    <!-- ==============================
         基本情報
    ============================== -->
    <section class="admin-section-card">

      <h2>
        旋盤 3インチ
      </h2>

      <div class="tool-detail-info">

        <p>
          <strong>管理番号：</strong>
          SB-3IN-001
        </p>

        <p>
          <strong>仕様：</strong>
          3インチ
        </p>

        <p>
          <strong>現在地：</strong>
          MTG
        </p>

        <p>
          <strong>担当者：</strong>
          二木
        </p>

        <p>
          <strong>状態：</strong>
          使用中
        </p>

      </div>

    </section>


    <!-- ==============================
         操作
    ============================== -->
    <section class="admin-section-card">

      <h2>
        操作
      </h2>

      <div class="tool-item-actions">

        <button
          type="button"
          class="admin-secondary-button"
        >
          移動
        </button>

        <button
          type="button"
          class="admin-primary-button"
        >
          返却
        </button>

      </div>

    </section>


    <!-- ==============================
         半年点検
    ============================== -->
    <section class="admin-section-card">

      <h2>
        半年点検
      </h2>

      <p>
        最終点検日：未登録
      </p>

      <p>
        次回点検：未登録
      </p>

      <p>
        点検シール番号：未登録
      </p>

      <div class="tool-item-actions">

        <button
          type="button"
          class="admin-secondary-button"
        >
          点検履歴を見る
        </button>

      </div>

    </section>


    <!-- ==============================
         QRコード
    ============================== -->
    <section class="admin-section-card">

      <h2>
        QRコード
      </h2>

      <p>
        この工具専用のQRコードを表示します。
      </p>

      <div class="tool-item-actions">

        <button
          type="button"
          class="admin-secondary-button"
        >
          QRコードを表示
        </button>

      </div>

    </section>


    <!-- ==============================
         履歴
    ============================== -->
    <section class="admin-section-card">

      <h2>
        移動履歴
      </h2>

      <div class="tool-history-list">

        <p>
          2026/08/27
          倉庫 → MTG
          ／ 二木
        </p>

      </div>

    </section>

  </main>


  <script src="portal-auth.js"></script>

</body>

</html>

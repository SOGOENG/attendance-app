<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    工具点検｜綜合エンジニアリング㈱
  </title>

  <link
    rel="stylesheet"
    href="style.css?v=25"
  >

  <link
    rel="stylesheet"
    href="side-menu.css?v=1"
  >
</head>


<body>

  <main class="admin-home-page">

    <header class="admin-home-header">

      <div class="admin-home-header-text">

        <h1>
          綜合エンジニアリング㈱

          <span class="admin-home-portal-title">
            Staff Portal
          </span>
        </h1>

        <p>
          半年点検
        </p>

      </div>

      <a
        id="inspectionEntryBackLink"
        href="tool-inspection.html"
        class="admin-home-back-button"
      >
        点検一覧へ戻る
      </a>

    </header>


    <!-- 工具情報 -->

    <section class="admin-section-card">

      <h2 id="inspectionEntryToolName">
        工具情報を読み込み中...
      </h2>

      <p>
        大分類：
        <strong id="inspectionEntryToolGroup">-</strong>
      </p>

      <p>
        管理番号：
        <strong id="inspectionEntryManagementCode">-</strong>
      </p>

      <p>
        規格：
        <strong id="inspectionEntrySpecification">-</strong>
      </p>

      <p>
        メーカー：
        <strong id="inspectionEntryManufacturer">-</strong>
      </p>

      <p>
        型式：
        <strong id="inspectionEntryModelNumber">-</strong>
      </p>

      <p>
        製造番号：
        <strong id="inspectionEntrySerialNumber">-</strong>
      </p>

      <p>
        点検区分：
        <strong id="inspectionEntryCategory">-</strong>
      </p>

    </section>


    <!-- 点検情報 -->

    <section class="admin-section-card">

      <h2>
        点検情報
      </h2>

      <label class="admin-form-label">
        点検日

        <input
          id="inspectionDate"
          type="date"
          class="admin-form-control"
        >
      </label>


      <label class="admin-form-label">
        シール番号

        <input
          id="inspectionStickerNumber"
          type="number"
          class="admin-form-control"
          min="1"
        >
      </label>

    </section>


    <!-- 点検項目 -->

    <section class="admin-section-card">

      <h2>
        点検項目
      </h2>

      <p id="inspectionChecklistGuide">
        点検項目を読み込み中...
      </p>

      <div
        id="inspectionChecklist"
        class="inspection-checklist"
      ></div>

    </section>


    <!-- 点検済みシール -->

    <section class="admin-section-card">

      <h2>
        点検済みシール
      </h2>

      <p id="inspectionStickerGuide">
        -
      </p>

      <label
        id="inspectionStickerConfirmLabel"
        class="inspection-check-row"
      >
        <input
          id="inspectionStickerConfirmed"
          type="checkbox"
        >

        <span>
          点検済みシールを確認
        </span>
      </label>

    </section>


    <!-- 点検結果 -->

    <section class="admin-section-card">

      <h2>
        点検結果
      </h2>

      <label class="admin-form-label">
        判定

        <select
          id="inspectionResult"
          class="admin-form-control"
        >
          <option value="">
            ---- 選択 ----
          </option>

          <option value="ok">
            OK
          </option>

          <option value="ng">
            NG
          </option>
        </select>
      </label>


      <label class="admin-form-label">
        不良内容

        <textarea
          id="inspectionDefectDetail"
          class="admin-form-control"
          rows="4"
          placeholder="NGの場合に入力"
        ></textarea>
      </label>


      <label class="admin-form-label">
        処置

        <textarea
          id="inspectionCorrectiveAction"
          class="admin-form-control"
          rows="4"
        ></textarea>
      </label>


      <label class="admin-form-label">
        備考

        <textarea
          id="inspectionNote"
          class="admin-form-control"
          rows="4"
        ></textarea>
      </label>


      <button
        id="saveInspectionButton"
        type="button"
        class="admin-primary-button"
      >
        点検結果を保存
      </button>

      <p
        id="inspectionEntryMessage"
        class="schedule-message"
      ></p>

    </section>

  </main>


  <script src="portal-auth.js"></script>
  <script src="side-menu.js?v=1"></script>
  <script src="./tool-inspection-entry.js?v=5"></script>

</body>

</html>

<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    工具QRコード｜綜合エンジニアリング㈱
  </title>

  <link
    rel="stylesheet"
    href="style.css?v=25"
  >

  <link
    rel="stylesheet"
    href="side-menu.css?v=1"
  >

  <style>

    .tool-qr-control-row {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin: 16px 0;
      padding: 16px;
      background: #f5f8fc;
      border-radius: 10px;
    }

    .tool-qr-control-label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-weight: 700;
    }

    .tool-qr-control-label input {
      width: 22px;
      height: 22px;
    }

    .tool-qr-item {
      padding: 14px 0;
      border-bottom: 1px solid #d9e2ef;
    }

    .tool-qr-item-main {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .tool-qr-checkbox {
      width: 22px;
      height: 22px;
      margin-top: 4px;
      flex-shrink: 0;
    }

    .tool-qr-item-content {
      flex: 1;
      min-width: 0;
    }

    .tool-qr-code-label {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      font-weight: 700;
    }

    .tool-qr-tool-name {
      margin-top: 7px;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .tool-qr-owner {
      margin-top: 5px;
      font-size: 0.95rem;
    }

    .tool-qr-sticker-option {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .tool-qr-sticker-option input {
      width: 20px;
      height: 20px;
    }


    /* =====================================
       画面表示
    ====================================== */

    .tool-qr-output-pages {
      margin-top: 18px;
    }

    .tool-qr-print-page {
      display: grid;
      grid-template-columns: repeat(5, 30mm);
      justify-content: center;
      gap: 11mm;
      margin-bottom: 24px;
    }

    .tool-qr-print-item {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      justify-content: flex-start;
      width: 30mm;
      height: 30mm;
      box-sizing: border-box;
    }


    /* QRラベル本体 */

    .tool-qr-label-body {
      box-sizing: border-box;

      width: 25mm;
      height: 30mm;

      min-width: 25mm;
      min-height: 30mm;

      padding: 0;

      border: 1px solid #777;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      background: #ffffff;
      color: #111111;
    }

    .tool-qr-code-area {
      box-sizing: border-box;
      width: 23mm;
      height: 23mm;
      min-width: 23mm;
      min-height: 23mm;
      padding: 2.5mm;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
    }

    .tool-qr-code-area canvas,
    .tool-qr-code-area img {
      width: 18mm !important;
      height: 18mm !important;
    }

    .tool-qr-output-code {
      margin-top: 0;
      font-size: 6.5pt;
      font-weight: 700;
      line-height: 1.15;
    }

    .tool-qr-output-name {
      margin-top: 0;
      max-width: 100%;
      max-height: 4mm;
      padding: 0 0.5mm;
      overflow: hidden;
      font-size: 5.5pt;
      line-height: 0.95;
      overflow-wrap: anywhere;
    }


    /* 点検シール番号タブ */

    .tool-qr-sticker-tab {
      box-sizing: border-box;

      width: 5mm;
      height: 30mm;

      min-width: 5mm;
      min-height: 30mm;

      border-top: 1px solid #777;
      border-right: 1px solid #777;
      border-bottom: 1px solid #777;
      border-left: 1px dashed #444;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0.4mm;

      background: #ffffff;
      color: #111111;

      flex-shrink: 0;
    }

    .tool-qr-sticker-tab-text {
      font-size: 5.5pt;
      font-weight: 700;

      writing-mode: vertical-rl;
      text-orientation: mixed;

      white-space: nowrap;
    }

    @media screen and (max-width: 820px) {
      .tool-qr-print-page {
        grid-template-columns: repeat(4, 30mm);
      }
    }

    @media screen and (max-width: 680px) {
      .tool-qr-print-page {
        grid-template-columns: repeat(3, 30mm);
      }
    }

    @media screen and (max-width: 500px) {
      .tool-qr-print-page {
        grid-template-columns: repeat(2, 30mm);
      }
    }


    /* =====================================
       A4印刷
    ====================================== */

    @page {
      size: A4 portrait;
      margin: 6mm;
    }


    @media print {

      .portal-side-menu-root,
      .portal-side-menu-toggle,
      .portal-side-menu-overlay,
      .portal-side-menu-panel {
        display: none !important;
        visibility: hidden !important;
      }

      html,
      body {
        width: auto !important;
        height: auto !important;
        min-height: 0 !important;

        margin: 0 !important;
        padding: 0 !important;

        overflow: visible !important;

        background: #ffffff !important;
      }


      main.admin-home-page {
        display: block !important;

        width: auto !important;
        height: auto !important;
        min-height: 0 !important;

        margin: 0 !important;
        padding: 0 !important;

        overflow: visible !important;

        background: #ffffff !important;
      }


      main.admin-home-page > * {
        display: none !important;
      }


      #toolQrOutputSection {
        display: block !important;

        position: static !important;

        width: auto !important;
        height: auto !important;
        min-height: 0 !important;

        margin: 0 !important;
        padding: 0 !important;

        border: none !important;
        border-radius: 0 !important;

        box-shadow: none !important;

        overflow: visible !important;

        background: #ffffff !important;
      }


      #toolQrOutputSection > * {
        display: none !important;
      }


      #toolQrOutputList {
        display: block !important;

        position: static !important;

        width: 198mm !important;

        margin: 0 !important;
        padding: 0 !important;

        overflow: visible !important;
      }


      /*
        1ページ = 35枚（5列×7段）
        Safari対策でflex固定
      */

      .tool-qr-print-page {
        display: flex !important;

        flex-direction: row !important;

        flex-wrap: wrap !important;

        align-content: flex-start !important;

        justify-content: flex-start !important;

        width: 198mm !important;

        height: 284mm !important;

        margin: 0 !important;
        padding: 3.5mm 1mm !important;

        box-sizing: border-box !important;

        column-gap: 11mm !important;

        row-gap: 11mm !important;

        break-after: page !important;

        page-break-after: always !important;

        overflow: hidden !important;
      }


      .tool-qr-print-page:last-child {
        break-after: auto !important;
        page-break-after: auto !important;
      }


      /*
        1枠 30mm
        5列固定
      */

      .tool-qr-print-item {
        display: flex !important;

        flex-direction: row !important;

        align-items: stretch !important;

        justify-content: flex-start !important;

        box-sizing: border-box !important;

        width: 30mm !important;

        height: 30mm !important;

        min-width: 30mm !important;
        min-height: 30mm !important;

        max-width: 30mm !important;
        max-height: 30mm !important;

        margin: 0 !important;
        padding: 0 !important;

        flex:
          0 0 30mm !important;

        overflow: hidden !important;

        break-inside: avoid !important;
        page-break-inside: avoid !important;
      }


      .tool-qr-label-body {
        box-sizing: border-box !important;

        width: 25mm !important;
        height: 30mm !important;

        min-width: 25mm !important;
        min-height: 30mm !important;

        max-width: 25mm !important;
        max-height: 30mm !important;

        margin: 0 !important;

        padding: 0 !important;

        border: 0.3mm solid #555 !important;

        background: #ffffff !important;

        color: #000000 !important;

        overflow: hidden !important;

        flex:
          0 0 25mm !important;

        print-color-adjust: exact;

        -webkit-print-color-adjust: exact;
      }

      .tool-qr-code-area {
        box-sizing: border-box !important;
        width: 23mm !important;
        height: 23mm !important;
        min-width: 23mm !important;
        min-height: 23mm !important;
        padding: 2.5mm !important;
        flex: 0 0 23mm !important;
        background: #ffffff !important;
      }


      .tool-qr-code-area canvas,
      .tool-qr-code-area img {
        width: 18mm !important;

        height: 18mm !important;

        max-width: 18mm !important;

        max-height: 18mm !important;
      }


      .tool-qr-output-code {
        margin-top: 0 !important;

        font-size: 6.5pt !important;

        font-weight: 700 !important;

        line-height: 1 !important;

        color: #000000 !important;
      }


      .tool-qr-output-name {
        margin-top: 0 !important;

        font-size: 5.5pt !important;

        line-height: 0.95 !important;

        max-height: 3.4mm !important;

        padding: 0 0.5mm !important;

        overflow: hidden !important;

        color: #000000 !important;
      }


      .tool-qr-sticker-tab {
        box-sizing: border-box !important;

        width: 5mm !important;
        height: 30mm !important;

        min-width: 5mm !important;
        min-height: 30mm !important;

        max-width: 5mm !important;
        max-height: 30mm !important;

        margin: 0 !important;

        padding: 0.4mm !important;

        border-top: 0.3mm solid #555 !important;
        border-right: 0.3mm solid #555 !important;
        border-bottom: 0.3mm solid #555 !important;
        border-left: 0.3mm dashed #555 !important;

        background: #ffffff !important;

        color: #000000 !important;

        overflow: hidden !important;

        flex:
          0 0 5mm !important;
      }


      .tool-qr-sticker-tab-text {
        font-size: 5.5pt !important;

        font-weight: 700 !important;

        color: #000000 !important;
      }
    }

  </style>

</head>


<body>

  <main class="admin-home-page">

    <header class="admin-home-header">

      <div class="admin-home-header-text">

        <h1>
          綜合エンジニアリング㈱

          <span class="admin-home-portal-title">
            Staff Portal
          </span>
        </h1>

        <p>
          工具QRコード
        </p>

      </div>


      <a
        href="tool-management.html"
        class="admin-home-back-button"
      >
        工具管理へ戻る
      </a>

    </header>


    <section class="admin-section-card">

      <h2>
        QRコード発行
      </h2>

      <p class="tool-search-guide">
        工具を検索してQRコードを表示・PDF保存します。
      </p>


      <label class="admin-form-label">

        大分類

        <select
          id="toolQrGroup"
          class="admin-form-control"
        >
          <option value="">
            すべて
          </option>
        </select>

      </label>


      <label class="admin-form-label">

        工具名

        <select
          id="toolQrName"
          class="admin-form-control"
        >
          <option value="">
            すべて
          </option>
        </select>

      </label>


      <label class="admin-form-label">

        所有区分

        <select
          id="toolQrOwnership"
          class="admin-form-control"
        >

          <option value="">
            すべて
          </option>

          <option value="shared">
            共有（会社）
          </option>

          <option value="personal">
            個人（会社社員）
          </option>

          <option value="contractor">
            協力業者
          </option>

        </select>

      </label>


      <label
        id="toolQrEmployeeLabel"
        class="admin-form-label"
        hidden
      >

        社員名

        <select
          id="toolQrEmployee"
          class="admin-form-control"
        >
          <option value="">
            すべて
          </option>
        </select>

      </label>


      <label
        id="toolQrContractorLabel"
        class="admin-form-label"
        hidden
      >

        協力業者名

        <select
          id="toolQrContractor"
          class="admin-form-control"
        >
          <option value="">
            すべて
          </option>
        </select>

      </label>


      <label class="admin-form-label">

        フリーワード

        <input
          id="toolQrSearch"
          type="search"
          class="admin-form-control"
          placeholder="管理番号・工具名・メーカーなど"
        >

      </label>


      <button
        id="toolQrSearchButton"
        type="button"
        class="admin-primary-button"
      >
        検索
      </button>

    </section>


    <section
      id="toolQrResultSection"
      class="admin-section-card hidden"
    >

      <div class="tool-result-header">

        <h2 id="toolQrResultTitle">
          検索結果
        </h2>


        <button
          id="toolQrResultClose"
          type="button"
          class="admin-secondary-button"
        >
          閉じる
        </button>

      </div>


      <div class="tool-qr-control-row">

        <label class="tool-qr-control-label">

          <input
            id="toolQrSelectAll"
            type="checkbox"
          >

          すべての工具にチェック

        </label>


        <label class="tool-qr-control-label">

          <input
            id="toolQrStickerAll"
            type="checkbox"
          >

          点検シール番号をすべて印字

        </label>

      </div>


      <p
        id="toolQrMessage"
        class="schedule-message"
      ></p>


      <div
        id="toolQrList"
        class="tool-list"
      ></div>


      <div
        class="admin-action-buttons"
        style="margin-top:18px;"
      >

        <button
          id="toolQrCreateButton"
          type="button"
          class="admin-primary-button"
        >
          選択したQRを表示
        </button>

      </div>

    </section>


    <section
      id="toolQrOutputSection"
      class="admin-section-card hidden"
    >

      <div class="tool-result-header">

        <h2>
          QRコード
        </h2>


        <button
          id="toolQrOutputClose"
          type="button"
          class="admin-secondary-button"
        >
          閉じる
        </button>

      </div>


      <p
        id="toolQrOutputMessage"
        class="schedule-message"
      ></p>


      <button
        id="toolQrPrintButton"
        type="button"
        class="admin-primary-button"
      >
        PDF保存
      </button>


      <div
        id="toolQrOutputList"
        class="tool-qr-output-pages"
      ></div>

    </section>

  </main>


  <script src="portal-auth.js"></script>
  <script src="side-menu.js?v=1"></script>

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
  ></script>

  <script src="./tool-qr.js?v=16"></script>

</body>

</html>

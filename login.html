<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    綜合エンジニアリング Staff Portal
  </title>

  <link
    rel="stylesheet"
    href="style.css?v=25"
  >

  <link rel="stylesheet" href="login.css?v=1">

  <link
    rel="manifest"
    href="manifest.json?v=2"
  >

  <link
    rel="apple-touch-icon"
    href="icons/se-apple-touch-icon.png?v=2"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >
</head>


<body>

  <main class="login-page">

    <section class="login-card">

      <div class="login-title-area">

        <h1>
          綜合エンジニアリング㈱
        </h1>

        <p>
          Staff Portal
        </p>

      </div>


      <form id="loginForm" novalidate>
      <label for="loginEmployee">
        社員ID
        <input id="loginEmployee" name="username" type="text" inputmode="numeric"
          autocomplete="username" autocapitalize="none" spellcheck="false"
          maxlength="16" aria-describedby="loginIdHelp" placeholder="社員IDを入力">
      </label>
      <p id="loginIdHelp" class="login-id-help">これまでと同じ社員ID・パスワードでログインしてください。社員IDが分からない場合は管理者へ確認してください。</p>

      <label for="loginPassword">

        パスワード

        <input
          id="loginPassword"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="パスワードを入力"
        >

      </label>


      <button
        id="loginButton"
        type="submit"
      >
        ログイン
      </button>


      <p
        id="loginMessage"
        class="login-message"
        role="status"
        aria-live="polite"
      ></p>

      </form>
    </section>

  </main>

  <script src="portal-auth.js"></script>
  <script src="login.js?v=5"></script>

</body>

</html>

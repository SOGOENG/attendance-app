<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>運転日報｜綜合エンジニアリング㈱</title>
  <link rel="stylesheet" href="style.css?v=25">
  <link rel="stylesheet" href="side-menu.css?v=1">
  <style>
    .driving-report-placeholder {
      min-height: 45vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
    }
    .driving-report-placeholder p { line-height: 1.8; }
    .driving-report-back {
      display: block;
      box-sizing: border-box;
      text-align: center;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="home-page">
    <header class="home-header">
      <div>
        <h1>運転日報</h1>
        <p>毎日の運転記録・車両点検</p>
      </div>
      <a href="my-page.html" class="logout-button driving-report-back">〈 マイページ</a>
    </header>

    <section class="driving-report-placeholder" aria-label="準備状況">
      <p>運転日報機能は現在準備中です</p>
      <a href="my-page.html" class="home-back-button">マイページへ戻る</a>
    </section>
  </main>

  <script src="portal-auth.js"></script>
  <script src="side-menu.js?v=1"></script>
  <script>
    if (!localStorage.getItem("portalLoginUser")) {
      redirectToPortalLogin();
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    工具持出｜綜合エンジニアリング㈱
  </title>

  <link
    rel="stylesheet"
    href="style.css?v=25"
  >

  <link
    rel="stylesheet"
    href="side-menu.css?v=1"
  >
</head>


<body>

  <main class="admin-home-page">

    <header class="admin-home-header">

      <div class="admin-home-header-text">

        <h1>
          綜合エンジニアリング㈱

          <span class="admin-home-portal-title">
            Staff Portal
          </span>
        </h1>

        <p>
          工具持出
        </p>

      </div>

      <a
        href="shared-tools.html"
        class="admin-home-back-button"
      >
        共有工具へ戻る
      </a>

    </header>


    <section class="admin-section-card">

      <h2 id="checkoutToolName">
        工具情報を読み込み中...
      </h2>

      <p id="checkoutToolCode">
        管理番号：-
      </p>

    </section>


    <section class="admin-section-card">

      <h2>
        持出先
      </h2>


      <label class="admin-form-label">

        現場

        <select
          id="checkoutSite"
          class="admin-form-control"
        >

          <option value="">
            ---- 現場を選択 ----
          </option>

        </select>

      </label>


      <label class="admin-form-label">

        持出者

        <select
          id="checkoutEmployee"
          class="admin-form-control"
        >

          <option value="">
            ---- 持出者を選択 ----
          </option>

        </select>

      </label>


      <label class="admin-form-label">

        備考

        <textarea
          id="checkoutNote"
          class="admin-form-control"
          rows="4"
        ></textarea>

      </label>


      <div class="admin-action-buttons">

        <button
          id="checkoutButton"
          type="button"
          class="admin-primary-button"
        >
          持出する
        </button>

      </div>

      <p
        id="checkoutMessage"
        class="schedule-message"
      ></p>

    </section>

  </main>


  <script src="portal-auth.js"></script>
  <script src="side-menu.js?v=1"></script>
  <script src="./tool-checkout.js?v=2"></script>

</body>

</html>

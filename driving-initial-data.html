<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>初回データ登録｜運転日報</title>
<link rel="stylesheet" href="style.css?v=25"><link rel="stylesheet" href="driving-report.css?v=7"></head>
<body><main class="home-page driving-page">
<header class="home-header"><div><h1>初回データ登録</h1><p>車両ごとの運用開始時の基準</p></div><a id="initialBack" class="logout-button" href="driving-report.html">日報へ戻る</a></header>
<p>前月最終メーターを登録します。過去の正式日報がある場合は日報を優先します。訂正しても保存済み日報のメーターは変更しません。</p>
<p id="initialMessage" class="driving-message" role="status" aria-live="polite">読み込み中…</p>
<form id="initialForm"><fieldset id="initialEditor" disabled>
<section class="card"><label>車両<select id="initialVehicle" required></select></label>
<label>基準日<input id="baselineDate" type="date" required></label>
<p class="driving-help">運用開始前の最終日（20日締めなら前の締め日）を指定してください。基準日の翌日以降の日報に使用します。</p>
<label>前月最終メーター（km）<input id="initialMeter" type="number" inputmode="decimal" min="0" max="9999999999.9" step="0.1" required></label></section>
<section class="card"><h2>前回給油情報</h2><p>不明な場合はすべて空欄にできます。登録する場合は日付・メーター・給油量をセットで入力してください。</p>
<label>前回給油日<input id="initialFuelDate" type="date"></label>
<label>給油時メーター（km）<input id="initialFuelMeter" type="number" inputmode="decimal" min="0" max="9999999999.9" step="0.1"></label>
<label>給油量（L）<input id="initialLiters" type="number" inputmode="decimal" min="0.001" max="999999.999" step="0.001"></label>
<label>給油所（任意）<input id="initialStation" maxlength="200"></label>
<label>支払方法（任意）<input id="initialPayment" maxlength="100"></label></section>
<p id="initialAudit" class="driving-help"></p><button id="saveInitial" type="submit">初回データを保存</button>
</fieldset></form><noscript>JavaScriptを有効にしてください。</noscript></main>
<script src="portal-auth.js"></script><script src="driving-report-period.js?v=1"></script><script src="driving-initial-data.js?v=1"></script></body></html>

<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>運転日報 月別一覧｜綜合エンジニアリング㈱</title>
<link rel="stylesheet" href="style.css?v=25"><link rel="stylesheet" href="side-menu.css?v=1"><link rel="stylesheet" href="driving-report.css?v=6"><link rel="stylesheet" href="driving-report-month.css?v=8"></head>
<body><main class="home-page driving-page driving-month"><header class="home-header"><div><h1>運転日報 月別一覧</h1><p id="monthlyEmployee"></p></div><a class="logout-button driving-back" href="my-page.html">〈 マイページ</a></header>
<section class="card monthly-overview"><div class="monthly-controls"><label for="closingMonth">対象月</label><select id="closingMonth" disabled></select></div>
<p id="monthlyPeriod"></p><div class="monthly-actions"><a id="todayReport" class="monthly-button" href="driving-report.html">今日の日報を開く</a><button type="button" id="reloadMonth" class="monthly-button" disabled>再読み込み</button></div>
<p id="monthlyCounts" aria-live="polite"></p><p id="monthlyMessage" role="status" aria-live="polite">本人情報を確認中…</p></section>
<section class="card" aria-label="日別の運転日報"><ul id="monthlyDays"></ul></section>
<section class="card monthly-submit"><h2>月別提出</h2><p id="monthSubmitMessage" role="status" aria-live="polite">月別提出状態を確認中…</p><p id="monthSubmitSummary" aria-live="polite"></p><details id="monthSubmitDetails"><summary>確認が必要な日付と理由</summary><ul id="monthSubmitIssues"></ul></details><button id="submitMonth" class="monthly-button" type="button" disabled>確認中…</button></section>
</main><script src="portal-auth.js"></script><script src="side-menu.js?v=1"></script><script src="driving-report-period.js?v=1"></script><script src="driving-report-workday.js?v=2"></script><script src="driving-report-month-mode.js?v=2"></script><script src="driving-report-month.js?v=7"></script></body></html>

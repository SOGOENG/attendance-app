<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>各種申請管理 - Staff Portal</title><link rel="stylesheet" href="style.css?v=26"><link rel="stylesheet" href="applications.css?v=4"></head><body><main class="applications-page"><header class="applications-header"><div><p class="applications-kicker">Staff Portal 管理者</p><h1>各種申請管理</h1></div><a class="applications-back" href="admin.html">管理画面へ</a></header>
<nav class="applications-tabs applications-admin-tabs"><button data-admin-panel="pending" data-application-admin-only hidden>承認待ち</button><button data-admin-panel="approved" data-application-admin-only hidden>承認済み履歴</button><button data-admin-panel="work" data-leave-manager-only hidden>代休残数管理</button><button data-admin-panel="balance" data-leave-manager-only hidden>有給残数管理</button></nav>
<section id="pendingPanel" class="applications-panel" hidden><div id="pendingList" class="application-list"><p class="empty">読み込み中...</p></div></section>
<section id="approvedPanel" class="applications-panel" hidden><div class="approved-history-filters"><label>年度<select id="approvedFiscalYear"></select></label><label>月<select id="approvedMonth"></select></label><label class="approved-printed-filter"><input id="approvedIncludePrinted" type="checkbox">印刷済みも表示</label></div><p id="approvedMessage" class="message" aria-live="polite"></p><div id="approvedList" class="application-list"><p class="empty">読み込み中...</p></div></section>
<section id="workPanel" class="applications-panel" hidden><form id="workForm"><h2>休日出勤登録</h2><input id="workRecordId" type="hidden"><div class="field"><label for="workDepartment">部署</label><select id="workDepartment" required><option value="">選択してください</option></select></div><div class="field"><label for="workEmployee">社員</label><select id="workEmployee" required><option value="">選択してください</option></select></div><div class="form-grid"><div class="field"><label for="workDate">出勤日</label><input id="workDate" type="date" required></div><div class="field"><label for="workDays">発生日数</label><input id="workDays" type="number" min="0.5" step="0.5" value="1" required></div></div><div class="field"><label for="workSite">現場</label><select id="workSite"><option value="">選択なし</option></select></div><div class="field"><label for="workNote">備考</label><textarea id="workNote" rows="2"></textarea></div><p id="workMessage" class="message"></p><div class="admin-actions"><button class="primary" type="submit">登録・更新</button><button id="workReset" class="secondary" type="button">入力をクリア</button></div></form><h2 class="admin-section-title">休日出勤一覧</h2><div id="workList" class="application-list"></div></section>
<section id="balancePanel" class="applications-panel" hidden><form id="balanceForm"><h2>有給初期残数</h2><div class="field"><label for="balanceDepartment">部署</label><select id="balanceDepartment" required><option value="">選択してください</option></select></div><div class="field"><label for="balanceEmployee">社員</label><select id="balanceEmployee" required><option value="">選択してください</option></select></div><div class="form-grid"><div class="field"><label for="fiscalYear">年度</label><input id="fiscalYear" type="number" min="2000" max="2200" required></div><div class="field"><label for="baseDate">経理取込基準日</label><input id="baseDate" type="date"></div><div class="field"><label for="grantedDays">支給日数</label><input id="grantedDays" type="number" min="0" step="0.5" required></div><div class="field"><label for="carriedDays">繰越日数</label><input id="carriedDays" type="number" min="0" step="0.5" required></div><div class="field"><label for="importedUsedDays">取込済み使用日数</label><input id="importedUsedDays" type="number" min="0" step="0.5" required></div><div class="field"><label for="adjustmentDays">調整日数</label><input id="adjustmentDays" type="number" step="0.5" value="0" required></div></div><p id="balanceMessage" class="message"></p><button class="primary" type="submit">登録・更新</button></form><h2 class="admin-section-title">有給残数一覧</h2><div id="balanceList" class="application-list"></div></section>
<dialog id="reviewDialog" class="dialog"><form method="dialog"><div id="reviewDetail"></div><div class="field"><label for="reviewComment">コメント</label><textarea id="reviewComment" rows="3"></textarea></div><div class="admin-actions"><button id="approve" type="button" class="primary">承認</button><button id="revision" type="button" class="secondary">差戻し</button><button id="reject" type="button" class="danger">却下</button><button value="cancel" class="secondary">閉じる</button></div></form></dialog>
</main><script src="portal-auth.js"></script><script src="applications-admin.js?v=7"></script></body></html>

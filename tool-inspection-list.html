<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    半年点検一覧｜綜合エンジニアリング㈱
  </title>

  <link
    rel="stylesheet"
    href="style.css?v=27"
  >

  <link
    rel="stylesheet"
    href="side-menu.css?v=1"
  >
</head>


<body>

  <main class="admin-home-page">

    <header class="admin-home-header">

      <div class="admin-home-header-text">

        <h1>
          綜合エンジニアリング㈱

          <span class="admin-home-portal-title">
            Staff Portal
          </span>
        </h1>

        <p>
          半年点検一覧
        </p>

      </div>

      <a
        href="tool-inspection.html"
        class="admin-home-back-button"
      >
        半年点検へ戻る
      </a>

    </header>


    <!-- =====================================
         点検サイクル情報
    ====================================== -->

    <section class="admin-section-card">

      <h2 id="inspectionListCycleName">
        点検情報を読み込み中...
      </h2>

      <p>
        状態：
        <strong id="inspectionListCycleStatus">
          -
        </strong>
      </p>

      <p>
        開始シール番号：
        <strong id="inspectionListStartSticker">
          -
        </strong>
      </p>

      <p>
        次回シール番号：
        <strong id="inspectionListNextSticker">
          -
        </strong>
      </p>

    </section>


    <!-- =====================================
         点検進捗
    ====================================== -->

    <section class="admin-section-card">

      <h2>
        点検進捗
      </h2>

      <p>
        対象工具：
        <strong id="inspectionTargetCount">
          0
        </strong>
        件
      </p>

      <p>
        点検済み：
        <strong id="inspectionCompletedCount">
          0
        </strong>
        件
      </p>

      <p>
        未点検：
        <strong id="inspectionPendingCount">
          0
        </strong>
        件
      </p>

    </section>


    <!-- =====================================
         QRコード読取
    ====================================== -->

    <section class="admin-section-card">

      <h2>
        工具QRコード
      </h2>

      <p>
        工具のQRコードを読み取り、点検入力画面を開きます。
      </p>

      <button
        id="inspectionQrStartButton"
        type="button"
        class="admin-primary-button"
        disabled
      >
        QRコードを読み込む
      </button>

      <div
        id="inspectionQrPanel"
        class="inspection-qr-panel hidden"
      >
        <div id="inspectionQrReader"></div>

        <button
          id="inspectionQrCancelButton"
          type="button"
          class="admin-secondary-button"
        >
          読み取りをキャンセル
        </button>
      </div>

      <p
        id="inspectionQrMessage"
        class="schedule-message"
        aria-live="polite"
      ></p>

      <a
        id="inspectionQrResultLink"
        class="admin-primary-button inspection-qr-result-link hidden"
        href="#"
      >
        点検結果を表示
      </a>

    </section>


    <!-- =====================================
         絞り込み
    ====================================== -->

    <section class="admin-section-card">

      <h2>
        点検工具を探す
      </h2>


      <label class="admin-form-label">
        大分類

        <select
          id="inspectionGroupFilter"
          class="admin-form-control"
        >
          <option value="">
            ---- 大分類を選択 ----
          </option>
        </select>
      </label>


      <label class="admin-form-label">
        工具名

        <select
          id="inspectionToolNameFilter"
          class="admin-form-control"
          disabled
        >
          <option value="">
            ---- 工具名を選択 ----
          </option>
        </select>
      </label>


      <label class="admin-form-label">
        点検状態

        <select
          id="inspectionStatusFilter"
          class="admin-form-control"
        >
          <option value="">
            すべて
          </option>

          <option value="pending">
            未点検
          </option>

          <option value="completed">
            点検済み
          </option>
        </select>
      </label>


      <button
        id="inspectionSearchButton"
        type="button"
        class="admin-primary-button"
      >
        表示する
      </button>

    </section>


    <!-- =====================================
         CSV出力
    ====================================== -->

    <section class="admin-section-card">

      <h2>
        CSV出力
      </h2>

      <p class="tool-search-guide">
        点検済み工具を条件で絞り込み、
        提出用Excelへ取り込めるCSVで出力します。
      </p>

      <button
        id="openInspectionCsvSettingsButton"
        type="button"
        class="admin-primary-button"
      >
        CSV出力設定
      </button>


      <!-- CSV出力設定 -->

      <div
        id="inspectionCsvSettingsPanel"
        style="display: none; margin-top: 24px;"
      >

        <h3>
          CSV出力設定
        </h3>


        <!-- 出力状態 -->

        <label class="admin-form-label">
          出力対象

          <select
            id="inspectionCsvExportStatus"
            class="admin-form-control"
          >
            <option value="unexported">
              未出力のみ
            </option>

            <option value="all">
              出力済みも含む
            </option>

            <option value="exported">
              出力済みのみ
            </option>
          </select>
        </label>


        <!-- 所有区分 -->

        <label class="admin-form-label">
          所有区分

          <select
            id="inspectionCsvOwnershipFilter"
            class="admin-form-control"
          >
            <option value="">
              すべて
            </option>

            <option value="shared">
              共有（会社）
            </option>

            <option value="personal">
              個人（会社社員）
            </option>

            <option value="contractor">
              協力業者
            </option>
          </select>
        </label>


        <!-- 現場 -->

        <label class="admin-form-label">
          現場

          <select
            id="inspectionCsvSiteFilter"
            class="admin-form-control"
          >
            <option value="">
              すべて
            </option>
          </select>
        </label>


        <!-- 社員 -->

        <label class="admin-form-label">
          個人所有者

          <select
            id="inspectionCsvEmployeeFilter"
            class="admin-form-control"
          >
            <option value="">
              すべて
            </option>
          </select>
        </label>


        <!-- 協力業者 -->

        <label class="admin-form-label">
          協力業者

          <select
            id="inspectionCsvContractorFilter"
            class="admin-form-control"
          >
            <option value="">
              すべて
            </option>
          </select>
        </label>


        <!-- 大分類 -->

        <label class="admin-form-label">
          大分類

          <select
            id="inspectionCsvGroupFilter"
            class="admin-form-control"
          >
            <option value="">
              すべて
            </option>
          </select>
        </label>


        <!-- 工具名 -->

        <label class="admin-form-label">
          工具名

          <select
            id="inspectionCsvToolNameFilter"
            class="admin-form-control"
            disabled
          >
            <option value="">
              すべて
            </option>
          </select>
        </label>


        <!-- 対象件数 -->

        <p
          id="inspectionCsvTargetCount"
          class="schedule-message"
        >
          出力対象：0件
        </p>


        <div class="admin-action-buttons">

          <button
            id="inspectionCsvExportButton"
            type="button"
            class="admin-primary-button"
          >
            CSVを出力する
          </button>


          <button
            id="inspectionCsvResetExportedButton"
            type="button"
            class="admin-secondary-button"
          >
            出力済みを未出力に戻す
          </button>


          <button
            id="closeInspectionCsvSettingsButton"
            type="button"
            class="admin-secondary-button"
          >
            閉じる
          </button>

        </div>


        <p
          id="inspectionCsvMessage"
          class="schedule-message"
        ></p>

      </div>

    </section>


    <!-- =====================================
         点検工具結果
    ====================================== -->

    <section
      id="inspectionToolResultSection"
      class="admin-section-card hidden"
    >

      <div class="tool-result-header">

        <h2 id="inspectionToolResultTitle">
          点検工具
        </h2>

        <button
          id="inspectionToolResultClose"
          type="button"
          class="admin-secondary-button"
        >
          閉じる
        </button>

      </div>


      <p
        id="inspectionToolResultCount"
        class="schedule-message"
      ></p>


      <div
        id="inspectionToolList"
        class="tool-list"
      ></div>

    </section>


    <p
      id="inspectionListMessage"
      class="schedule-message"
    ></p>

  </main>


  <script src="portal-auth.js"></script>
  <script src="side-menu.js?v=1"></script>

  <script
    src="https://unpkg.com/html5-qrcode"
  ></script>

  <script src="./tool-groups.js?v=1"></script>
  <script src="./tool-inspection-list.js?v=16"></script>

</body>

</html>
